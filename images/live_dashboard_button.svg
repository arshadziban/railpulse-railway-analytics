<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 300 60" role="img" aria-label="View Live Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4B4B"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="298" height="58" rx="29" fill="url(#bg)"/>
  <circle cx="34" cy="30" r="6" fill="#FFFFFF">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="34" cy="30" r="11" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <text x="160" y="37" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">View Live Dashboard  →</text>
</svg>
